server:
    port: 8083

spring:
    application:
        name: order-service
    datasource:
        url: jdbc:postgresql://localhost:5432/shopflow_orders
        username: ${DB_USERNAME:shopflow}
        password: ${DB_PASSWORD:secret}
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            connection-timeout: 30000
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                default_batch_fetch_size: 20
    flyway:
        enabled: true
        locations: classpath:db/migration
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-minimum-32-chars!!}

services:
    product-service:
        url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: always

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui

# Enable @Scheduled
scheduling:
    enabled: true
