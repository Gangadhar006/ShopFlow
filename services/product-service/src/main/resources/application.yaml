server:
    port: 8082

spring:
    application:
        name: product-service
    data:
        mongodb:
            uri: mongodb://${MONGO_USERNAME:shopflow}:${MONGO_PASSWORD:secret}@localhost:27017/shopflow_products?authSource=admin

jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-minimum-32-chars!!}

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: always

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui
