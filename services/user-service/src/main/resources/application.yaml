server:
    port: 8081

spring:
    application:
        name: user-service
    datasource:
        url: jdbc:postgresql://localhost:5432/shopflow_users
        username: ${DB_USERNAME:shopflow}
        password: ${DB_PASSWORD:secret}
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            connection-timeout: 30000
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
                default_batch_fetch_size: 20
    flyway:
        enabled: true
        locations: classpath:db/migration

jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-minimum-32-chars!!}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: always

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui
